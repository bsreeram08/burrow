[package]
name = "chatcore"
version = "0.1.0"
edition = "2021"
description = "Shared end-to-end messaging core: X3DH + Double Ratchet, wire-compatible with packages/signaling/public/signal.js"
license = "MIT"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha2 = "=0.10.9"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
rusqlite = { version = "=0.32.1", features = ["bundled"], optional = true }
# WebAssembly (crates/chatcore-wasm): browser randomness and clock.
getrandom = { version = "=0.2.17", features = ["js"], optional = true }
js-sys = { version = "=0.3.106", optional = true }
# MLS groups (src/mls). Pinned exactly; see API.md (Groups) and the spike's FINDINGS.md.
openmls = { version = "=0.9.0", default-features = false, optional = true }
openmls_rust_crypto = { version = "=0.6.0", optional = true }
openmls_traits = { version = "=0.6.0", optional = true }
openmls_basic_credential = { version = "=0.6.0", optional = true }
# RustCrypto 0.11-era crates pulled in by hpke-rs need getrandom 0.4 with its own wasm backend.
getrandom04 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"], optional = true }

[features]
default = ["native", "mls", "ds"]
# Groups over MLS: the client engine (create, join, commit, receive, encrypt, KeyPackages, payloads).
mls = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_traits", "dep:openmls_basic_credential"]
# The delivery service's commit validator over public group state (the same validator `mls` runs).
# Build with `--no-default-features --features ds,wasm` for the Bun/Node delivery service.
ds = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_traits", "dep:openmls_basic_credential"]
# Native apps and the interop CLI: SQLite key database.
native = ["dep:rusqlite"]
# Browser build: no SQLite (the journal is persisted to IndexedDB by the JS shim).
wasm = ["dep:getrandom", "dep:js-sys", "dep:getrandom04", "openmls?/js"]

[[bin]]
name = "interop"
required-features = ["native"]

[profile.release]
lto = true
